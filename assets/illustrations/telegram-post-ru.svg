<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="34" fill="#fbf8f0"/><rect x="18" y="18" width="1164" height="584" rx="28" fill="none" stroke="#eadfc9" stroke-width="3"/><text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="43" fill="#103e34">Пост в канале: что должно быть понятно</text><rect x="120" y="136" width="960" height="366" rx="26" fill="#ffffff" stroke="#ddd4c3" stroke-width="2"/><circle cx="180" cy="198" r="34" fill="#2aabee"/><path d="M160 197l42-16-13 47-13-14-9 8 3-15z" fill="#fff"/><text x="235" y="190" font-family="Arial, sans-serif" font-weight="700" font-size="27" fill="#173f36">Подборки игр и бонусов</text><text x="235" y="225" font-family="Arial, sans-serif" font-size="20" fill="#7a8581">Публикация в тематическом канале</text><text x="164" y="292" font-family="Arial, sans-serif" font-weight="700" font-size="30" fill="#103e34">Новая подборка на сегодня</text><text x="164" y="340" font-family="Arial, sans-serif" font-size="24" fill="#334640">Коротко объясните, что человек увидит после перехода</text><text x="164" y="382" font-family="Arial, sans-serif" font-size="24" fill="#334640">и почему ему стоит открыть ссылку именно сейчас.</text><rect x="164" y="418" width="328" height="54" rx="16" fill="#edf5f1"/><text x="328" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#176b58">Перейти к подборке</text><text x="650" y="458" font-family="Arial, sans-serif" font-size="18" fill="#6a7772">28 реакций   •   7 комментариев   •   1,8 тыс. просмотров</text><text x="600" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#56645f">Один пост = одна отдельная метка, чтобы результат можно было проверить</text></svg>