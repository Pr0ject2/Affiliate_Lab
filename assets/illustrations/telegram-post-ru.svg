<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Структура поста, который можно измерить</title>
  <desc id="desc">Тема, польза, понятный следующий шаг и отдельная метка</desc>
  <rect width="1200" height="540" rx="32" fill="#fbf8f0"/>
  <rect x="18" y="18" width="1164" height="504" rx="26" fill="none" stroke="#eadfc9" stroke-width="3"/>
  <text x="600" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="40" fill="#103e34">Пост: четыре вещи должны быть понятны</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#176b58"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(170 260)">
      <circle r="82" fill="#f5ead5"/>
      <rect x="-38" y="-48" width="76" height="96" rx="12" fill="#fff" stroke="#176b58" stroke-width="5"/>
      <path d="M-22 -20 H22 M-22 0 H15 M-22 20 H8" stroke="#176b58" stroke-width="7" stroke-linecap="round"/>
      <text y="126" fill="#103e34" font-weight="700" font-size="25">Тема</text>
      <text y="158" fill="#56645f" font-size="19">о чём пост</text>
    </g>
    <g transform="translate(455 260)">
      <circle r="82" fill="#f5ead5"/>
      <path d="M-45 5 L-12 36 L48 -38" fill="none" stroke="#176b58" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="126" fill="#103e34" font-weight="700" font-size="25">Польза</text>
      <text y="158" fill="#56645f" font-size="19">зачем читать дальше</text>
    </g>
    <g transform="translate(745 260)">
      <circle r="82" fill="#f5ead5"/>
      <rect x="-50" y="-25" width="100" height="50" rx="14" fill="#176b58"/>
      <path d="M-18 0 H22 M10 -12 L24 0 L10 12" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="126" fill="#103e34" font-weight="700" font-size="25">Следующий шаг</text>
      <text y="158" fill="#56645f" font-size="19">одно понятное действие</text>
    </g>
    <g transform="translate(1030 260)">
      <circle r="82" fill="#f5ead5"/>
      <path d="M-46 -26 H26 L48 0 L26 26 H-46 Z" fill="#176b58"/>
      <circle cx="22" cy="0" r="8" fill="#f1c766"/>
      <text y="126" fill="#103e34" font-weight="700" font-size="25">Метка</text>
      <text y="158" fill="#56645f" font-size="19">для отдельного учёта</text>
    </g>
  </g>

  <path d="M265 260 H348" stroke="#176b58" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M550 260 H638" stroke="#176b58" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M840 260 H923" stroke="#176b58" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
