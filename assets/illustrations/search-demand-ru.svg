<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="34" fill="#fbf8f0"/><rect x="18" y="18" width="1164" height="584" rx="28" fill="none" stroke="#eadfc9" stroke-width="3"/><text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="43" fill="#103e34">Проверяйте интерес к теме во времени</text><text x="600" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#56645f">График помогает увидеть сезонность и сравнить направления</text><line x1="120" y1="470" x2="1100" y2="470" stroke="#cfc8ba" stroke-width="3"/><line x1="120" y1="175" x2="120" y2="470" stroke="#cfc8ba" stroke-width="3"/><g stroke="#e7e1d6" stroke-width="2"><line x1="120" y1="395" x2="1100" y2="395"/><line x1="120" y1="320" x2="1100" y2="320"/><line x1="120" y1="245" x2="1100" y2="245"/></g><polyline fill="none" stroke="#176b58" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="130,410 210,390 290,405 370,345 450,355 530,275 610,300 690,245 770,270 850,205 930,235 1010,190 1090,215"/><polyline fill="none" stroke="#d39b2b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="130,435 210,430 290,410 370,420 450,390 530,405 610,370 690,385 770,355 850,370 930,350 1010,365 1090,340"/><g font-family="Arial, sans-serif" font-size="20" fill="#65726d"><text x="120" y="510">январь</text><text x="560" y="510">июнь</text><text x="1020" y="510">декабрь</text></g><rect x="720" y="146" width="335" height="72" rx="18" fill="#fff" stroke="#ddd4c3" stroke-width="2"/><circle cx="758" cy="171" r="8" fill="#176b58"/><text x="780" y="178" font-family="Arial, sans-serif" font-size="20" fill="#334640">основная тема</text><circle cx="758" cy="198" r="8" fill="#d39b2b"/><text x="780" y="205" font-family="Arial, sans-serif" font-size="20" fill="#334640">вариант для сравнения</text><text x="600" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#56645f">Рост графика показывает относительный интерес, а не готовую конверсию</text></svg>