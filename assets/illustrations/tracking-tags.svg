<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Пример разметки источников</title><desc id="d">Отдельные метки для площадки, формата и публикации.</desc><rect width="900" height="430" rx="28" fill="#f7f2e8"/><g font-family="Arial, sans-serif"><text x="54" y="62" font-size="28" font-weight="700" fill="#173f35">Одна ссылка на всё скрывает результат</text><text x="54" y="96" font-size="17" fill="#64716b">Разделяйте хотя бы площадку, формат и конкретную публикацию.</text><rect x="54" y="135" width="792" height="214" rx="18" fill="#fffdf9" stroke="#d8d0c1"/><g font-size="16"><text x="82" y="177" font-weight="700" fill="#173f35">Источник</text><text x="282" y="177" font-weight="700" fill="#173f35">Формат</text><text x="476" y="177" font-weight="700" fill="#173f35">Метка</text><text x="682" y="177" font-weight="700" fill="#173f35">Что сравниваем</text><line x1="74" y1="194" x2="826" y2="194" stroke="#e4ddd1"/><text x="82" y="230" fill="#46534d">VK</text><text x="282" y="230" fill="#46534d">клип</text><text x="476" y="230" fill="#275c4d">vk_clip_01</text><text x="682" y="230" fill="#46534d">клики / FTD</text><line x1="74" y1="247" x2="826" y2="247" stroke="#eee8de"/><text x="82" y="283" fill="#46534d">Telegram</text><text x="282" y="283" fill="#46534d">пост</text><text x="476" y="283" fill="#275c4d">tg_post_04</text><text x="682" y="283" fill="#46534d">клики / FTD</text><line x1="74" y1="300" x2="826" y2="300" stroke="#eee8de"/><text x="82" y="336" fill="#46534d">YouTube</text><text x="282" y="336" fill="#46534d">Shorts</text><text x="476" y="336" fill="#275c4d">yt_short_12</text><text x="682" y="336" fill="#46534d">клики / FTD</text></g><rect x="54" y="370" width="792" height="36" rx="12" fill="#edf3ef"/><text x="74" y="394" font-size="15" fill="#315447">Так видно, какой формат приводит игрока, а какой только собирает просмотры.</text></g></svg>