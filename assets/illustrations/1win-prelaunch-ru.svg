t-size="36" font-weight="700" fill="white">3</text><text x="736.0" y="305" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17342d">Бренд</text><text x="736.0" y="345" text-anchor="middle" font-family="Arial" font-size="18" fill="#64716c">используется корректно</text><path d="M 865.0 285 H 879.0" stroke="#0b5d4d" stroke-width="5"/><path d="M 869.0 276 L 879.0 285 L 869.0 294" fill="none" stroke="#0b5d4d" stroke-width="5"/><rect x="886.0" y="170" width="244.0" height="230" rx="24" fill="#fffdf8" stroke="#e6dcc7" stroke-width="2"/><circle cx="1008.0" cy="225" r="34" fill="#0b5d4d"/><text x="1008.0" y="238" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="white">4</text><text x="1008.0" y="305" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17342d">Тест</text><text x="1008.0" y="345" text-anchor="middle" font-family="Arial" font-size="18" fill="#64716c">GEO, ссылка, регистрация</text><rect x="70" y="438" width="1060" height="70" rx="18" fill="#edf5f1"/><text x="600" y="480" text-anchor="middle" font-family="Arial" font-size="20" fill="#17342d">Если хотя бы один пункт не подтверждён, сначала уточните его у менеджера, а уже потом запускайте трафик.</text></svg>