<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Воронка видео-трафика</title><desc id="d">Просмотры, переход к ссылке, клик, регистрация и первый депозит.</desc><rect width="900" height="430" rx="28" fill="#f7f2e8"/><g font-family="Arial, sans-serif"><text x="54" y="62" font-size="28" font-weight="700" fill="#173f35">Не смешивайте просмотры с результатом</text><text x="54" y="95" font-size="17" fill="#64716b">Каждый следующий шаг нужно считать отдельно.</text><g transform="translate(54 145)"><rect x="0" y="0" width="145" height="150" rx="20" fill="#fffdf9" stroke="#d8d0c1"/><circle cx="72" cy="46" r="26" fill="#e4eee8"/><path d="M62 34l26 12-26 12z" fill="#275c4d"/><text x="72" y="102" text-anchor="middle" font-size="19" font-weight="700" fill="#173f35">Просмотр</text><text x="72" y="128" text-anchor="middle" font-size="14" fill="#6c756f">ролика</text></g><text x="215" y="225" font-size="34" fill="#9b927f">→</text><g transform="translate(250 145)"><rect x="0" y="0" width="145" height="150" rx="20" fill="#fffdf9" stroke="#d8d0c1"/><circle cx="72" cy="46" r="26" fill="#e4eee8"/><path d="M58 47c0-8 6-14 14-14h8v8h-8a6 6 0 000 12h8v8h-8c-8 0-14-6-14-14zm36-14h8c8 0 14 6 14 14s-6 14-14 14h-8v-8h8a6 6 0 000-12h-8v-8zm-20 10h24v8H74z" fill="#275c4d" transform="translate(-15 0)"/><text x="72" y="102" text-anchor="middle" font-size="19" font-weight="700" fill="#173f35">Переход</text><text x="72" y="128" text-anchor="middle" font-size="14" fill="#6c756f">к ссылке</text></g><text x="411" y="225" font-size="34" fill="#9b927f">→</text><g transform="translate(446 145)"><rect x="0" y="0" width="145" height="150" rx="20" fill="#fffdf9" stroke="#d8d0c1"/><circle cx="72" cy="46" r="26" fill="#e4eee8"/><circle cx="72" cy="40" r="9" fill="#275c4d"/><path d="M53 62c4-12 34-12 38 0z" fill="#275c4d"/><text x="72" y="102" text-anchor="middle" font-size="19" font-weight="700" fill="#173f35">Регистрация</text><text x="72" y="128" text-anchor="middle" font-size="14" fill="#6c756f">в казино</text></g><text x="607" y="225" font-size="34" fill="#9b927f">→</text><g transform="translate(642 145)"><rect x="0" y="0" width="180" height="150" rx="20" fill="#173f35"/><circle cx="90" cy="46" r="26" fill="#f1e9d9"/><path d="M74 37h32v22H74z" fill="#275c4d"/><path d="M82 32h16v8H82z" fill="#275c4d"/><text x="90" y="102" text-anchor="middle" font-size="19" font-weight="700" fill="#fffdf9">FTD</text><text x="90" y="128" text-anchor="middle" font-size="14" fill="#d8e1dc">первый депозит</text></g><rect x="54" y="332" width="768" height="54" rx="14" fill="#edf3ef"/><text x="78" y="365" font-size="17" fill="#315447">Если просмотров много, а переходов мало, проблема находится до клика.</text></g></svg>