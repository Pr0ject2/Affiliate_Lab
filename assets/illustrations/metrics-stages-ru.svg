<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Что смотреть в статистике</title>
  <desc id="desc">Четыре этапа: клики, регистрации, первые депозиты и доход</desc>
  <rect width="1200" height="520" rx="32" fill="#fbf8f0"/>
  <rect x="18" y="18" width="1164" height="484" rx="26" fill="none" stroke="#eadfc9" stroke-width="3"/>
  <text x="600" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="42" fill="#103e34">Что смотреть в статистике</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#176b58"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" fill="#103e34" text-anchor="middle">
    <g transform="translate(180 235)">
      <circle r="82" fill="#f5ead5"/>
      <path d="M-24 -18 L34 40 M8 -30 L38 -44 L25 -13" fill="none" stroke="#176b58" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="128" font-weight="700" font-size="25">Клики</text>
    </g>
    <g transform="translate(460 235)">
      <circle r="82" fill="#f5ead5"/>
      <circle cy="-22" r="25" fill="#176b58"/>
      <path d="M-48 40 C-40 3 40 3 48 40 Z" fill="#176b58"/>
      <text y="128" font-weight="700" font-size="25">Регистрации</text>
    </g>
    <g transform="translate(740 235)">
      <circle r="82" fill="#f5ead5"/>
      <rect x="-48" y="-35" width="96" height="70" rx="14" fill="#176b58"/>
      <circle cx="18" cy="0" r="15" fill="#f1c766"/>
      <path d="M-24 -12 h30 M-24 10 h18" stroke="#fbf8f0" stroke-width="7" stroke-linecap="round"/>
      <text y="120" font-weight="700" font-size="24">Первый</text>
      <text y="151" font-weight="700" font-size="24">депозит</text>
    </g>
    <g transform="translate(1020 235)">
      <circle r="82" fill="#f5ead5"/>
      <rect x="-44" y="18" width="22" height="42" rx="5" fill="#176b58"/>
      <rect x="-10" y="-8" width="22" height="68" rx="5" fill="#d39b2b"/>
      <rect x="24" y="-40" width="22" height="100" rx="5" fill="#176b58"/>
      <path d="M-48 -18 L-10 -52 L18 -35 L48 -72" fill="none" stroke="#103e34" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="128" font-weight="700" font-size="25">Доход</text>
    </g>
  </g>

  <path d="M275 235 H350" stroke="#176b58" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M555 235 H630" stroke="#176b58" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M835 235 H910" stroke="#176b58" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
