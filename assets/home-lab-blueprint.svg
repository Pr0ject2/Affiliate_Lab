  </g>

  <!-- right target -->
  <g transform="translate(1290 620)">
    <circle cx="120" cy="120" r="134" class="c s3"/>
    <circle cx="120" cy="120" r="92" class="c s3"/>
    <circle cx="120" cy="120" r="54" class="c s3"/>
    <rect x="100" y="100" width="40" height="40" class="c s3"/>
    <path class="c s3" d="M120 0v240M0 120h240"/>
  </g>

  <!-- beneath first cards flask + scale lines -->
  <g transform="translate(330 1210)">
    <path class="c s1" d="M95 0 l4 86 -45 96 c-14 31 -7 58 10 72 18 16 39 18 87 18 46 0 67 -3 84 -18 19 -16 24 -42 12 -70 l-46 -98 5 -86"/>
