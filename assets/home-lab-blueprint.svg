    <path class="c s3" d="M24 36 v24 M64 36 v24 M104 36 v24 M144 36 v24 M184 36 v24 M224 36 v24 M264 36 v24 M304 36 v24 M344 36 v24 M384 36 v24 M424 36 v24 M464 36 v24 M504 36 v24 M544 36 v24 M584 36 v24 M624 36 v24 M664 36 v24"/>
  </g>

  <!-- right middle measurements / arrows -->
  <g transform="translate(1210 1260)">
    <path class="c s3" d="M0 160h220"/>
    <path class="c s3" d="M0 80h220"/>
    <path class="c s3" d="M110 0v240"/>
    <path class="c s3" d="M10 35 l30 12 32 -12"/>
    <path class="c s3" d="M165 130 c16 0 28 6 39 20 8 10 11 18 15 35"/>
    <path class="c s3" d="M126 138 h42"/>
    <path class="c s3" d="M22 189 c20 -2 41 1 59 10 27 14 55 18 82 8"/>
  </g>

