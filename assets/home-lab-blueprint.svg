<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#82959f" stroke-opacity=".105" stroke-width="1"/>
      <path d="M32 0V64M0 32H64" fill="none" stroke="#82959f" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="3" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" filter="url(#noise)" opacity=".72"/>

  <!-- large flask blueprint in the empty right side of the hero -->
  <g fill="none" stroke="#719c8e" stroke-linecap="round" stroke-linejoin="round">
    <g opacity=".24" stroke-width="1.5">
      <path d="M1248 176h92M1273 176v132l-120 216c-13 24 4 53 32 53h218c28 0 45-29 32-53l-120-216V176h25"/>
      <path d="M1192 466c45 24 90 3 135 22 38 16 75 8 111-4"/>
      <path d="M1175 536h277"/>
      <circle cx="1244" cy="420" r="8"/>
      <circle cx="1334" cy="473" r="6"/>
      <circle cx="1378" cy="410" r="5"/>
    </g>
    <g opacity=".15" stroke-width="1">
      <path d="M1110 620h410M1150 650h330"/>
      <path d="M1160 114h250M1194 94v40M1378 94v40"/>
      <circle cx="1450" cy="220" r="64"/>
      <circle cx="1450" cy="220" r="39"/>
      <path d="M1360 220h180M1450 130v180M1405 175l90 90M1495 175l-90 90"/>
    </g>
  </g>

  <!-- small drafting marks and route diagram -->
  <g fill="none" stroke="#7e929c" stroke-width="1.1" opacity=".13">
    <circle cx="260" cy="740" r="86"/>
    <circle cx="260" cy="740" r="52"/>
    <path d="M148 740h224M260 628v224"/>
    <path d="M510 162L610 118 705 172 798 128 900 184"/>
    <path d="M610 118v124M705 172v114M798 128v162"/>
  </g>
  <g fill="#78958b" opacity=".16">
    <circle cx="510" cy="162" r="3"/><circle cx="610" cy="118" r="3"/><circle cx="705" cy="172" r="3"/>
    <circle cx="798" cy="128" r="3"/><circle cx="900" cy="184" r="3"/>
  </g>

  <!-- subtle measurement ticks -->
  <g stroke="#8397a1" stroke-width="1" opacity=".10">
    <path d="M1020 90v38M1048 100v18M1076 100v18M1104 90v38"/>
    <path d="M1000 780h38M1010 752v18M1010 724v18M1000 696h38"/>
  </g>
</svg>