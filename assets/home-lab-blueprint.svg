  <g transform="translate(108 2010)">
    <path class="c s3" d="M0 162h270M28 0v194"/>
    <path class="c s3" d="M31 140 c28 -32 52 -58 82 -74 30 -16 69 -28 116 -34"/>
    <path class="c s3" d="M190 20 l39 32 -44 15"/>
    <path class="c s3" d="M62 72 l30 16 16 -31"/>
    <text x="36" y="192" class="t tiny">ctr / reg / ftd</text>
  </g>

  <!-- section 2 right circles and layout -->
  <g transform="translate(1240 1890)">
    <circle cx="120" cy="176" r="88" class="c s3"/>
    <circle cx="120" cy="176" r="40" class="c s3"/>
    <path class="c s3" d="M120 18v316M6 176h228"/>
    <path class="c s3" d="M52 62 h139 v230 H52 z"/>
    <path class="c s3" d="M72 105 h98 M72 134 h98 M72 162 h62"/>
