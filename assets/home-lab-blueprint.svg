    <path class="c s3" d="M20 24 h96 M20 44 h88 M20 64 h68"/>
    <path class="c s3" d="M142 45 h80"/>
    <path class="c s3" d="M220 45 l-12 -9 m12 9 l-12 9"/>
    <rect x="252" y="15" width="116" height="62" rx="2" class="c s3"/>
    <text x="18" y="122" class="t tiny">source → offer → test</text>
  </g>

  <!-- lower right plot -->
  <g transform="translate(1180 2890)">
    <path class="c s3" d="M0 220 h288 M46 0 v252"/>
    <path class="c s3" d="M46 182 c40 -20 72 -32 98 -48 25 -16 42 -41 62 -63 14 -16 36 -31 72 -47"/>
    <path class="c s3" d="M235 35 l44 -12 -17 40"/>
    <path class="c s3" d="M120 132 c16 7 26 22 29 42"/>
    <path class="c s3" d="M74 96 c13 10 21 24 23 44"/>
