  <!-- bottom small chemistry doodles -->
  <g transform="translate(430 3460)">
    <path class="c s3" d="M0 44 c20 -8 40 -10 60 -6 19 5 34 5 46 -1"/>
    <path class="c s3" d="M132 8 l22 28 26 -26 20 24"/>
    <path class="c s3" d="M250 0 c10 6 14 16 14 30 0 14 -4 24 -14 31 -10 -7 -14 -17 -14 -31 0 -14 4 -24 14 -30z"/>
  </g>

  <!-- gentle chalk dust -->
  <g filter="url(#dust)" opacity=".11">
    <rect width="1600" height="3800" fill="#ffffff"/>
  </g>
</svg>
